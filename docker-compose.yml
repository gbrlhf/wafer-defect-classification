services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wafer-defect-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - wafer-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wafer-defect-backend
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
      - API_PORT=8001
      - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://localhost
    restart: unless-stopped
    networks:
      - wafer-net

networks:
  wafer-net:
    driver: bridge
